[theme]
primaryColor = "#667eea"
backgroundColor = "#f0f4ff"
secondaryBackgroundColor = "#ffffff"
textColor = "#2d3748"
font = "sans serif"

[server]
headless = true
enableCORS = false
enableXsrfProtection = true

[browser]
gatherUsageStats = false
serverAddress = "retrogh.shop"
serverPort = 443

[client]
showErrorDetails = false
toolbarMode = "minimal"

[runner]
# Disable the warning about running on low-memory
magicEnabled = false

# Hide "Made with Streamlit" footer
[ui]
hideTopBar = true
hideSidebarNav = true
